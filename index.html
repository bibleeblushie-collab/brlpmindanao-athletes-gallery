<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login • Babe Ruth League Mindanao</title>

<style>
body{
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  background:#f5f5f5;
}

.box{
  width:350px;
  background:white;
  padding:28px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

h2{
  margin-top:0;
  margin-bottom:20px;
  color:#14532D;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:6px;
  box-sizing:border-box;
}

input:focus{
  outline:2px solid #23813B;
  border-color:#23813B;
}

button{
  width:100%;
  padding:12px;
  background:#14532D;
  color:white;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  transition:background 0.2s;
}

button:hover{
  background:#0f3d21;
}

.error-msg{
  color:#D62828;
  font-size:13px;
  margin-bottom:12px;
  display:none;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
  <h2>Administrator Login</h2>
  <div id="errorMsg" class="error-msg">Invalid email or password.</div>

  <form id="loginForm" onsubmit="login(event)">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
</div>

<script>
function login(e){
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorMsg = document.getElementById("errorMsg");

  if (email === "admin@brlmindanao.com" && password === "Admin123") {
    sessionStorage.setItem("isAdmin", "true");
    window.location.href = "admin.html";
  } else {
    errorMsg.style.display = "block";
  }
}
</script>

</body>
</html>
