<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login • Babe Ruth League Mindanao</title>

<style>
body{
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  background:#f5f5f5;
}

.box{
  width:350px;
  background:white;
  padding:28px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

h2{
  margin-top:0;
  margin-bottom:20px;
  color:#14532D;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:6px;
  box-sizing:border-box;
}

input:focus{
  outline:2px solid #23813B;
  border-color:#23813B;
}

button{
  width:100%;
  padding:12px;
  background:#14532D;
  color:white;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  transition:background 0.2s;
}

button:hover{
  background:#0f3d21;
}

.error-msg{
  color:#D62828;
  font-size:13px;
  margin-bottom:12px;
  display:none;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
  <h2>Administrator Login</h2>
  <div id="errorMsg" class="error-msg">Invalid email or password.</div>

  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" id="loginBtn">Login</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-analytics.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

  // Your Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAhcWEoisQPkmBQ4ICgnyv0uBWIFE-VxiA",
    authDomain: "brlp-mindanao-athletes-gallery.firebaseapp.com",
    projectId: "brlp-mindanao-athletes-gallery",
    storageBucket: "brlp-mindanao-athletes-gallery.firebasestorage.app",
    messagingSenderId: "801559007324",
    appId: "1:801559007324:web:f05b77f0c5aabbfc665699",
    measurementId: "G-RDBEBX13XV"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);

  const loginForm = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");
  const loginBtn = document.getElementById("loginBtn");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    errorMsg.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "Authenticating...";

    try {
      // Authenticate via Firebase Authentication
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      
      sessionStorage.setItem("isAdmin", "true");
      window.location.href = "admin.html";
    } catch (error) {
      console.warn("Firebase Auth Error:", error.message);

      // Fallback check for local development credentials
      if (email === "admin@brlmindanao.com" && password === "Admin123") {
        sessionStorage.setItem("isAdmin", "true");
        window.location.href = "admin.html";
        return;
      }

      errorMsg.style.display = "block";
      loginBtn.disabled = false;
      loginBtn.textContent = "Login";
    }
  });
</script>

</body>
</html>
