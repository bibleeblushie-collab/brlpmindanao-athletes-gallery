<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>

body{
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#f5f5f5;
}

.box{
  width:350px;
  background:white;
  padding:25px;
  border-radius:12px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:12px;
  background:#14532D;
  color:white;
  border:0;
  border-radius:8px;
}

</style>

</head>

<body>

<div class="box">

<h2>Administrator Login</h2>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

<script>

function login(){

const email=
document.getElementById("email").value;

const password=
document.getElementById("password").value;

if (
    email === "admin@brlmindanao.com" &&
    password === "Admin123"
) {

    sessionStorage.setItem("isAdmin", "true");

    window.location.href = "index.html";

} else {

    alert("Invalid login");

}
}

</script>

</body>
</html>
