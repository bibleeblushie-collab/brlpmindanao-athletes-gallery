<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Profile • Babe Ruth League Philippines</title>
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhcWEoisQPkmBQ4ICgnyv0uBWIFE-VxiA",
      authDomain: "brlp-mindanao-athletes-gallery.firebaseapp.com",
      projectId: "brlp-mindanao-athletes-gallery",
      storageBucket: "brlp-mindanao-athletes-gallery.firebasestorage.app",
      messagingSenderId: "801559007324",
      appId: "1:801559007324:web:f05b77f0c5aabbfc665699",
      measurementId: "G-RDBEBX13XV"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>

  <style>
    body { font-family: Inter, Segoe UI, sans-serif; background: #F7FAF7; color: #183326; margin: 0; padding: 20px; }
    .card { max-width: 600px; margin: 20px auto; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-top: 6px solid #14532D; }
    .header { text-align: center; }
    .photo { width: 180px; height: 180px; object-fit: cover; border-radius: 50%; border: 4px solid #14532D; margin-bottom: 12px; }
    h1 { margin: 8px 0 4px; color: #14532D; }
    .subtitle { color: #65766B; font-weight: 700; text-transform: uppercase; font-size: 14px; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    td { padding: 10px 0; border-bottom: 1px solid #E0EAE2; }
    td:first-child { font-weight: bold; color: #586B5D; width: 35%; }
    .docs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .btn { background: #14532D; color: white; padding: 10px 16px; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: bold; border: 0; cursor: pointer; display: inline-block; }
    .btn:hover { background: #0f3d21; }
    .btn-secondary { background: #D62828; }
    .actions { margin-top: 24px; text-align: center; display: flex; justify-content: center; gap: 10px; }
  </style>
</head>
<body>

<div class="card" id="profileCard">Loading profile...</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
function getQueryParam(key) {
  return new URLSearchParams(window.location.search).get(key) || '';
}

function esc(s = '') {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 1. Try reading athlete details from URL Query Parameters
let athlete = {
  id: getQueryParam('id'),
  name: getQueryParam('name'),
  sport: getQueryParam('sport'),
  division: getQueryParam('division'),
  team: getQueryParam('team'),
  position: getQueryParam('position'),
  jersey: getQueryParam('jersey'),
  city: getQueryParam('city'),
  season: getQueryParam('season'),
  bio: getQueryParam('bio'),
  photo: getQueryParam('photo'),
  birthCert: getQueryParam('birthCert'),
  schoolId: getQueryParam('schoolId'),
  medicalCert: getQueryParam('medicalCert'),
  consentForm: getQueryParam('consentForm'),
  waiverForm: getQueryParam('waiverForm')
};

// 2. Fallback to LocalStorage if opened directly or missing parameter details
if (!athlete.name && athlete.id) {
  const KEY = 'brlMindanaoAthletes_v1';
  const localAthletes = JSON.parse(localStorage.getItem(KEY) || '[]');
  const found = localAthletes.find(a => a.id === athlete.id);
  if (found) athlete = { ...found };
}

const card = document.getElementById('profileCard');

if (!athlete.name && !athlete.id) {
  card.innerHTML = `<h2 style="text-align:center;color:#D62828;">Athlete profile not found.</h2>`;
} else {
  card.innerHTML = `
    <div class="header">
      ${athlete.photo ? `<img src="${esc(athlete.photo)}" class="photo">` : `<div style="font-size:64px;">⚾</div>`}
      <h1>${esc(athlete.name || 'Unknown Athlete')}</h1>
      <div class="subtitle">${esc(athlete.sport || 'Baseball')} • ${esc(athlete.division || 'N/A')}</div>
      <small style="color:#65766B;">Charter ID: ${esc(athlete.id || 'BRLP-MIN-001')}</small>
    </div>
    <table>
      <tr><td>Team / League</td><td>${esc(athlete.team || 'N/A')}</td></tr>
      <tr><td>Position</td><td>${esc(athlete.position || 'N/A')}</td></tr>
      <tr><td>Jersey #</td><td>${esc(athlete.jersey || 'N/A')}</td></tr>
      <tr><td>City / Province</td><td>${esc(athlete.city || 'N/A')}</td></tr>
      <tr><td>Season</td><td>${esc(athlete.season || 'N/A')}</td></tr>
      <tr><td>Bio</td><td>${esc(athlete.bio || 'N/A')}</td></tr>
    </table>
    
    <h3>Verified Documents</h3>
    <div class="docs">
      ${athlete.birthCert ? `<a href="${esc(athlete.birthCert)}" target="_blank" class="btn">Birth Certificate</a>` : ''}
      ${athlete.schoolId ? `<a href="${esc(athlete.schoolId)}" target="_blank" class="btn">School ID</a>` : ''}
      ${athlete.medicalCert ? `<a href="${esc(athlete.medicalCert)}" target="_blank" class="btn">Medical Certificate</a>` : ''}
      ${athlete.consentForm ? `<a href="${esc(athlete.consentForm)}" target="_blank" class="btn">Parental Consent</a>` : ''}
      ${athlete.waiverForm ? `<a href="${esc(athlete.waiverForm)}" target="_blank" class="btn">Waiver Form</a>` : ''}
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="printIDCard()">🪪 Print ID Card</button>
    </div>
  `;
}

// Function to print athlete ID Card directly from profile page
function printIDCard() {
  if (!athlete.name) return;

  const charterId = athlete.id || 'BRLP-MIN-001';
  const currentURL = window.location.href;
  const templateUrl = new URL('id-template.png', window.location.href).href;

  QRCode.toDataURL(currentURL, { width: 300 }, function(err, qrData) {
    if (err) {
      alert("Unable to render QR code for printing.");
      console.error(err);
      return;
    }

    const w = window.open('', '_blank');
    w.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
      <base href="${window.location.href}">
      <title>ID Card - ${esc(athlete.name)}</title>
      <style>
        @page { size: A4 portrait; margin: 0mm; }
        @media print {
          html, body { width: 210mm; height: 297mm; margin: 0; padding: 0; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          .card { width: 210mm !important; height: 297mm !important; box-shadow: none !important; page-break-after: avoid !important; page-break-inside: avoid !important; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; width: 210mm; height: 297mm; font-family: Arial, sans-serif; background: #ffffff; overflow: hidden; }
        .card { position: relative; width: 210mm; height: 297mm; overflow: hidden; background: #ffffff; }
        .bg { position: absolute; top: 0; left: 0; width: 210mm; height: 297mm; object-fit: fill; z-index: 1; }
        .photo { position: absolute; top: 70mm; left: 50%; transform: translateX(-50%); width: 80mm; height: 80mm; object-fit: cover; border-radius: 3mm; z-index: 2; }
        .name { position: absolute; top: 155mm; left: 55%; transform: translateX(-50%); width: 76%; text-align: center; font-size: 8.5mm; font-weight: 900; color: #14532D; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4mm; z-index: 2; }
        .role { position: absolute; top: 172mm; left: 50%; transform: translateX(-50%); width: 76%; text-align: center; font-size: 8.5mm; font-weight: 800; color: #14532D; text-transform: uppercase; letter-spacing: 0.5mm; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4mm; z-index: 2; }
        .charter { position: absolute; top: 190mm; left: 50%; transform: translateX(-50%); width: 76%; text-align: center; font-size: 8.5mm; font-weight: 800; color: #183326; font-family: Arial, sans-serif; letter-spacing: 0.3mm; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4mm; z-index: 2; }
        .division { position: absolute; top: 205mm; left: 50%; transform: translateX(-50%); width: 76%; text-align: center; font-size: 8.5mm; font-weight: 800; color: #14532D; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4mm; z-index: 2; }
        .qr { position: absolute; top: 230mm; left: 6.5mm; width: 60mm; height: 60mm; z-index: 2; background: #ffffff; padding: 1.5mm; border-radius: 2mm; }
      </style>
      </head>
      <body>
      <div class="card">
        <img src="${templateUrl}" class="bg" id="bgTemplate">
        ${athlete.photo ? `<img src="${esc(athlete.photo)}" class="photo">` : ''}
        <div class="name">${esc(athlete.name)}</div>
        <div class="role">PLAYER</div>
        <div class="charter">${esc(charterId)}</div>
        <div class="division">${esc(athlete.sport)} • ${esc(athlete.division)}</div>
        <img src="${qrData}" class="qr">
      </div>
      <script>
        function triggerPrint() { window.focus(); window.print(); }
        const templateImg = document.getElementById('bgTemplate');
        if (templateImg.complete) { setTimeout(triggerPrint, 300); }
        else { templateImg.onload = function() { setTimeout(triggerPrint, 300); }; templateImg.onerror = function() { triggerPrint(); }; }
      ` + '<' + `/script>
      </body>
      </html>
    `);
    w.document.close();
  });
}
</script>

</body>
</html>
