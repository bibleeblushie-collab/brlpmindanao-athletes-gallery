<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Babe Ruth League Philippines • Mindanao Athlete Gallery</title>

<style>
:root{
  --navy:#14532D;
  --red:#D62828;
  --gold:#F4C430;
  --bg:#F7FAF7;
  --ink:#183326;
  --muted:#65766B;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

/* HEADER */
header{
  background:linear-gradient(120deg,#14532D 0%,#23813B 70%,#2D9148);
  color:white;
  padding:28px 5vw 35px;
  position:relative;
  overflow:hidden;
}

header:after{
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  border:45px solid #ffffff18;
  border-radius:50%;
  right:-100px;
  top:-160px;
}

.topline{
  font-size:12px;
  letter-spacing:2px;
  font-weight:800;
  color:var(--gold);
  text-transform:uppercase;
}

h1{
  font-size:clamp(26px,4vw,42px);
  margin:12px 0 8px;
  line-height:1.1;
}

header p{
  margin:0;
  color:#E5F2E7;
  max-width:700px;
}

/* MAIN CONTAINER */
.wrap{
  max-width:1200px;
  margin:-18px auto 50px;
  padding:0 22px;
  position:relative;
}

/* STATISTICS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:24px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:18px 22px;
  box-shadow:0 6px 20px #14532D12;
  border:1px solid #E0EAE2;
  border-top:4px solid var(--gold);
}

.stat small{
  color:var(--muted);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:11px;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:5px;
  color:var(--navy);
}

/* SEARCH AND TOOLBAR */
.toolbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  margin:22px 0;
}

input,select,button{font:inherit}

.search{
  flex:1;
  min-width:210px;
  background:white;
  border:1px solid #D6E3D8;
  border-radius:10px;
  padding:12px 14px;
}

.search:focus{
  outline:2px solid #23813B;
  border-color:#23813B;
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(.96);
}

/* BUTTON COLORS */
.primary{
  background:var(--red);
  color:white;
}

.dark{
  background:var(--navy);
  color:white;
}

.light{
  background:#E8F1E9;
  color:var(--navy);
}

.primary:hover{
  background:#B91F1F;
}

.dark:hover{
  background:#103F22;
}

/* SECTION HEADER */
.sectionhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:25px 0 15px;
}

.sectionhead h2{
  margin:0;
  font-size:21px;
  color:var(--navy);
}

.sectionhead span{
  color:var(--muted);
  font-size:13px;
}

/* ATHLETE GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(225px,1fr));
  gap:18px;
}
.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #E0EAE2;
  box-shadow:0 7px 22px #14532D10;
  transition:transform .2s,box-shadow .2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 28px #14532D20;
}

.photo{
  height:280px;
  background:linear-gradient(135deg,#EAF4EC,#D1E6D5);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.cardbody{
  padding:15px;
}

.name{
  font-size:18px;
  font-weight:850;
  margin:0 0 6px;
  color:var(--navy);
}

.meta{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
}

/* ATHLETE TAG */
.tag{
  display:inline-block;
  background:#FFF3C4;
  color:#775600;
  padding:4px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:800;
  margin-top:8px;
}

.cardactions{
  display:flex;
  gap:6px;
  margin-top:12px;
}

.cardactions button{
  flex:1;
  font-size:11px;
  padding:6px;
}

/* EMPTY GALLERY */
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  background:white;
  border:1px dashed #B9D1BE;
  border-radius:16px;
  color:var(--muted);
}

/* FOOTER */
footer{
  text-align:center;
  color:#7A897E;
  font-size:12px;
  padding:28px;
  border-top:3px solid var(--gold);
  background:#FFFFFF;
}

/* ADD / EDIT ATHLETE MODAL */
dialog{
  border:0;
  border-radius:18px;
  width:min(560px,94vw);
  padding:0;
  box-shadow:0 25px 80px #0005;
}

dialog::backdrop{
  background:#0c1830a8;
  backdrop-filter:blur(3px);
}

.modalhead{
  background:var(--navy);
  color:white;
  padding:20px 24px;
  border-bottom:4px solid var(--gold);
}

.modalhead h2{
  margin:0;
}

.form{
  padding:22px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:12px;
  font-weight:800;
  color:#586B5D;
}

.field input,
.field select,
.field textarea{
  padding:11px;
  border:1px solid #D6E3D8;
  border-radius:8px;
  width:100%;
  background:#fff;
  color:var(--ink);
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  outline:2px solid #23813B;
  border-color:#23813B;
}

.field textarea{
  resize:vertical;
}

.formbuttons{
  grid-column:1/-1;
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:8px;
}

.hint{
  font-size:11px;
  color:var(--muted);
}

.logo{
  width:150px;
  height:150px;
  object-fit:contain;
  flex-shrink:0;
}

.header-brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  position:relative;
  z-index:2;
  text-align:left;
}

/* MOBILE RESPONSIVE */
@media(max-width:600px){
  .stats{gap:8px}
  .stat{padding:13px}
  .stat strong{font-size:22px}
  .form{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .sectionhead{
    align-items:flex-start;
    flex-direction:column;
  }
  .header-brand{
    flex-direction:column;
    text-align:center;
  }
  .logo{
    width:60px;
    height:60px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-brand">
    <img src="logo.png" alt="Babe Ruth League Logo" class="logo">
    <div>
      <div class="topline">Babe Ruth League • Philippines</div>
      <h1>Mindanao Athlete Gallery</h1>
      <p>
        Celebrating the talent, teamwork, and sportsmanship of our grassroots
        baseball and softball athletes.
      </p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat">
      <small>Total Athletes</small>
      <strong id="total">0</strong>
    </div>

    <div class="stat">
      <small>Baseball</small>
      <strong id="baseball">0</strong>
    </div>

    <div class="stat">
      <small>Softball</small>
      <strong id="softball">0</strong>
    </div>
  </div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="Search athlete, team, city, or division…">

    <select class="search" id="sport">
        <option value="">All sports</option>
        <option>Baseball</option>
        <option>Softball</option>
    </select>

    <select class="search" id="division">
        <option value="">All divisions</option>
        <option>12U</option>
        <option>14U</option>
        <option>16U</option>
        <option>18U</option>
    </select>

    <button id="addBtn" class="btn primary" onclick="openForm()">+ Add Athlete</button>
    <button class="btn dark" onclick="exportCSV()">Export CSV</button>
