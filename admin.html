<style>
:root{
  --navy:#14532D;
  --red:#D62828;
  --gold:#F4C430;
  --bg:#F7FAF7;
  --ink:#183326;
  --muted:#65766B;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

/* HEADER */
header{
  background:linear-gradient(120deg,#14532D 0%,#23813B 70%,#2D9148);
  color:white;
  padding:28px 5vw 35px;
  position:relative;
  overflow:hidden;
}

header:after{
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  border:45px solid #ffffff18;
  border-radius:50%;
  right:-100px;
  top:-160px;
}

.topline{
  font-size:12px;
  letter-spacing:2px;
  font-weight:800;
  color:var(--gold);
  text-transform:uppercase;
}

h1{
  font-size:clamp(26px,4vw,42px);
  margin:12px 0 8px;
  line-height:1.1;
}

header p{
  margin:0;
  color:#E5F2E7;
  max-width:700px;
}
