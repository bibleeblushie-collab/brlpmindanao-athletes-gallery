<body>

<h1>Profile Page Loaded</h1>

<div id="profile"></div>

<script>

const athletes =
JSON.parse(
localStorage.getItem("brlMindanaoAthletes_v1") || "[]"
);

const params =
new URLSearchParams(window.location.search);

const athleteId =
params.get("id");

document.getElementById("profile").innerHTML = `
<p>Athlete ID: ${athleteId}</p>
<p>Total Athletes: ${athletes.length}</p>
`;

</script>

</script>

</body>
