<body>

<h1>Profile Page Loaded</h1>

<div id="profile"></div>

<script>

const params =
new URLSearchParams(window.location.search);

const athleteId =
params.get("id");

document.getElementById("profile").innerHTML =
`
<p>ID from QR:</p>
<p>${athleteId}</p>
`;

</script>

</body>
