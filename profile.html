<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Profile • Babe Ruth League Philippines</title>
  <style>
    body { font-family: Inter, Segoe UI, sans-serif; background: #F7FAF7; color: #183326; margin: 0; padding: 20px; }
    .card { max-width: 600px; margin: 20px auto; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-top: 6px solid #14532D; }
    .header { text-align: center; }
    .photo { width: 180px; height: 180px; object-fit: cover; border-radius: 50%; border: 4px solid #14532D; margin-bottom: 12px; }
    h1 { margin: 8px 0 4px; color: #14532D; }
    .subtitle { color: #65766B; font-weight: 700; text-transform: uppercase; font-size: 14px; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    td { padding: 10px 0; border-bottom: 1px solid #E0EAE2; }
    td:first-child { font-weight: bold; color: #586B5D; width: 35%; }
    .docs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .btn { background: #14532D; color: white; padding: 8px 14px; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card" id="profileCard">Loading profile...</div>

<script>
function getQueryParam(key) {
  return new URLSearchParams(window.location.search).get(key) || '';
}

function esc(s = '') {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

// 1. Read URL Query Parameters
const id = getQueryParam('id');
let name = getQueryParam('name');
let sport = getQueryParam('sport');
let division = getQueryParam('division');
let team = getQueryParam('team');
let position = getQueryParam('position');
let jersey = getQueryParam('jersey');
let city = getQueryParam('city');
let season = getQueryParam('season');
let bio = getQueryParam('bio');
let photo = getQueryParam('photo');
let birthCert = getQueryParam('birthCert');
let schoolId = getQueryParam('schoolId');
let medicalCert = getQueryParam('medicalCert');
let consentForm = getQueryParam('consentForm');
let waiverForm = getQueryParam('waiverForm');

// 2. Fallback to LocalStorage if only 'id' was provided in the URL
if (!name && id) {
  const localData = JSON.parse(localStorage.getItem("brlMindanaoAthletes_v1") || "[]");
  const localAthlete = localData.find(a => a.id === id);
  if (localAthlete) {
    name = localAthlete.name || '';
    sport = localAthlete.sport || '';
    division = localAthlete.division || '';
    team = localAthlete.team || '';
    position = localAthlete.position || '';
    jersey = localAthlete.jersey || '';
    city = localAthlete.city || '';
    season = localAthlete.season || '';
    bio = localAthlete.bio || '';
    photo = localAthlete.photo || '';
    birthCert = localAthlete.birthCert || '';
    schoolId = localAthlete.schoolId || '';
    medicalCert = localAthlete.medicalCert || '';
    consentForm = localAthlete.consentForm || '';
    waiverForm = localAthlete.waiverForm || '';
  }
}

const card = document.getElementById('profileCard');

if (!name && !id) {
  card.innerHTML = `<h2 style="text-align:center;color:#D62828;">Athlete profile not found.</h2>`;
} else {
  card.innerHTML = `
    <div class="header">
      ${photo ? `<img src="${esc(photo)}" class="photo">` : `<div style="font-size:64px;">⚾</div>`}
      <h1>${esc(name || 'Athlete Profile')}</h1>
      <div class="subtitle">${esc(sport)} • ${esc(division)}</div>
      <small style="color:#65766B;">Charter ID: ${esc(id)}</small>
    </div>
    <table>
      <tr><td>Team / League</td><td>${esc(team || 'N/A')}</td></tr>
      <tr><td>Position</td><td>${esc(position || 'N/A')}</td></tr>
      <tr><td>Jersey #</td><td>${esc(jersey || 'N/A')}</td></tr>
      <tr><td>City / Province</td><td>${esc(city || 'N/A')}</td></tr>
      <tr><td>Season</td><td>${esc(season || 'N/A')}</td></tr>
      <tr><td>Bio</td><td>${esc(bio || 'N/A')}</td></tr>
    </table>
    <h3>Verified Documents</h3>
    <div class="docs">
      ${birthCert ? `<a href="${esc(birthCert)}" target="_blank" class="btn">Birth Certificate</a>` : ''}
      ${schoolId ? `<a href="${esc(schoolId)}" target="_blank" class="btn">School ID</a>` : ''}
      ${medicalCert ? `<a href="${esc(medicalCert)}" target="_blank" class="btn">Medical Certificate</a>` : ''}
      ${consentForm ? `<a href="${esc(consentForm)}" target="_blank" class="btn">Parental Consent</a>` : ''}
      ${waiverForm ? `<a href="${esc(waiverForm)}" target="_blank" class="btn">Waiver Form</a>` : ''}
    </div>
  `;
}
</script>
</body>
</html>
