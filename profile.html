<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Profile • Babe Ruth League Philippines</title>
  <style>
    body { font-family: Inter, Segoe UI, sans-serif; background: #F7FAF7; color: #183326; margin: 0; padding: 20px; }
    .card { max-width: 600px; margin: 20px auto; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-top: 6px solid #14532D; }
    .header { text-align: center; }
    .photo-container { width: 180px; height: 180px; margin: 0 auto 12px; position: relative; }
    .photo { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid #14532D; display: block; }
    .photo-fallback { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #14532D; background: #EAF4EC; display: flex; align-items: center; justify-content: center; font-size: 64px; }
    h1 { margin: 8px 0 4px; color: #14532D; }
    .subtitle { color: #65766B; font-weight: 700; text-transform: uppercase; font-size: 14px; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    td { padding: 10px 0; border-bottom: 1px solid #E0EAE2; }
    td:first-child { font-weight: bold; color: #586B5D; width: 35%; }
    .docs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .btn { background: #14532D; color: white; padding: 8px 14px; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: bold; }
    .debug-link { display: block; font-size: 11px; color: #D62828; margin-top: 6px; text-decoration: underline; }
  </style>
</head>
<body>

<div class="card" id="profileCard">Loading profile...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhcWEoisQPkmBQ4ICgnyv0uBWIFE-VxiA",
  authDomain: "brlp-mindanao-athletes-gallery.firebaseapp.com",
  projectId: "brlp-mindanao-athletes-gallery",
  storageBucket: "brlp-mindanao-athletes-gallery.firebasestorage.app",
  messagingSenderId: "801559007324",
  appId: "1:801559007324:web:f05b77f0c5aabbfc665699",
  measurementId: "G-RDBEBX13XV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getQueryParam(key) {
  return new URLSearchParams(window.location.search).get(key) || '';
}

// Safely escape text values without breaking web URLs
function escText(s = '') {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function loadProfile() {
  const card = document.getElementById('profileCard');
  const id = getQueryParam('id');

  if (!id) {
    card.innerHTML = `<h2 style="text-align:center;color:#D62828;">Athlete profile not found.</h2>`;
    return;
  }

  let athlete = null;

  // 1. Fetch document from Firestore
  try {
    const docRef = doc(db, "athletes", id);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      athlete = docSnap.data();
    }
  } catch (err) {
    console.warn("Firestore fetch error:", err);
  }

  // 2. Fallback to local storage if Firestore fetch is unavailable
  if (!athlete) {
    const localData = JSON.parse(localStorage.getItem("brlMindanaoAthletes_v1") || "[]");
    athlete = localData.find(a => a.id === id);
  }

  if (!athlete || !athlete.name) {
    card.innerHTML = `<h2 style="text-align:center;color:#D62828;">Athlete profile not found.</h2>`;
    return;
  }

  const rawPhotoUrl = athlete.photo ? String(athlete.photo).trim() : '';
  const isWebUrl = rawPhotoUrl.startsWith('http://') || rawPhotoUrl.startsWith('https://');

  card.innerHTML = `
    <div class="header">
      <div class="photo-container">
        ${isWebUrl ? `
          <img 
            src="${rawPhotoUrl}" 
            class="photo" 
            alt="${escText(athlete.name)}"
            onerror="this.style.display='none'; document.getElementById('photoFallback').style.display='flex'; document.getElementById('debugLink').style.display='block';"
          >
          <div id="photoFallback" class="photo-fallback" style="display:none;">⚾</div>
        ` : `
          <div class="photo-fallback">⚾</div>
        `}
      </div>
      
      ${isWebUrl ? `<a id="debugLink" href="${rawPhotoUrl}" target="_blank" class="debug-link" style="display:none;">Photo load error. Click to test image URL</a>` : ''}

      <h1>${escText(athlete.name)}</h1>
      <div class="subtitle">${escText(athlete.sport)} •${escText(athlete.division)}</div>
      <small style="color:#65766B;">Charter ID: ${escText(athlete.id)}</small>
    </div>

    <table>
      <tr><td>Team / League</td><td>${escText(athlete.team || 'N/A')}</td></tr>
      <tr><td>Position</td><td>${escText(athlete.position || 'N/A')}</td></tr>
      <tr><td>Jersey #</td><td>${escText(
