<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Profile • Babe Ruth League Philippines</title>
  <style>
    body { font-family: Inter, Segoe UI, sans-serif; background: #F7FAF7; color: #183326; margin: 0; padding: 20px; }
    .card { max-width: 600px; margin: 20px auto; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-top: 6px solid #14532D; }
    .header { text-align: center; }
    .photo { width: 180px; height: 180px; object-fit: cover; border-radius: 50%; border: 4px solid #14532D; margin-bottom: 12px; }
    h1 { margin: 8px 0 4px; color: #14532D; }
    .subtitle { color: #65766B; font-weight: 700; text-transform: uppercase; font-size: 14px; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    td { padding: 10px 0; border-bottom: 1px solid #E0EAE2; }
    td:first-child { font-weight: bold; color: #586B5D; width: 35%; }
    .docs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .btn { background: #14532D; color: white; padding: 8px 14px; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card" id="profileCard">Loading profile...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhcWEoisQPkmBQ4ICgnyv0uBWIFE-VxiA",
  authDomain: "brlp-mindanao-athletes-gallery.firebaseapp.com",
  projectId: "brlp-mindanao-athletes-gallery",
  storageBucket: "brlp-mindanao-athletes-gallery.firebasestorage.app",
  messagingSenderId: "801559007324",
  appId: "1:801559007324:web:f05b77f0c5aabbfc665699",
  measurementId: "G-RDBEBX13XV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getQueryParam(key) {
  return new URLSearchParams(window.location.search).get(key) || '';
}

function esc(s = '') {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

async function loadProfile() {
  const card = document.getElementById('profileCard');
  const id = getQueryParam('id');

  if (!id) {
    card.innerHTML = `<h2 style="text-align:center;color:#D62828;">Athlete profile not found.</h2>`;
    return;
  }

  let athlete = null;

  // 1. Fetch profile from Firebase Firestore
  try {
    const docRef = doc(db, "athletes", id);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      athlete = docSnap.data();
    }
  } catch (err) {
    console.warn("Firestore fetch error:", err);
  }

  // 2. Fallback to local storage (for offline host device)
  if (!athlete) {
    const localData = JSON.parse(localStorage.getItem("brlMindanaoAthletes_v1") || "[]");
    athlete = localData.find(a => a.id === id);
  }

  // 3. Fallback to URL Query Parameters
  if (!athlete && getQueryParam('name')) {
    athlete = {
      id: id,
      name: getQueryParam('name'),
      sport: getQueryParam('sport'),
      division: getQueryParam('division'),
      team: getQueryParam('team'),
      position: getQueryParam('position'),
      jersey: getQueryParam('jersey'),
      city: getQueryParam('city'),
      season: getQueryParam('season'),
      bio: getQueryParam('bio'),
      photo: getQueryParam('photo'),
      birthCert: getQueryParam('birthCert'),
      schoolId: getQueryParam('schoolId'),
      medicalCert: getQueryParam('medicalCert'),
      consentForm: getQueryParam('consentForm'),
      waiverForm: getQueryParam('waiverForm')
    };
  }

  if (!athlete || !athlete.name) {
    card.innerHTML = `<h2 style="text-align:center;color:#D62828;">Athlete profile not found.</h2>`;
    return;
  }

  card.innerHTML = `
    <div class="header">
      ${athlete.photo ? `<img src="${esc(athlete.photo)}" class="photo" alt="${esc(athlete.name)}">` : `<div style="font-size:64px;">⚾</div>`}
      <h1>${esc(athlete.name)}</h1>
      <div class="subtitle">${esc(athlete.sport)} • ${esc(athlete.division)}</div>
      <small style="color:#65766B;">Charter ID: ${esc(athlete.id)}</small>
    </div>
    <table>
      <tr><td>Team / League</td><td>${esc(athlete.team || 'N/A')}</td></tr>
      <tr><td>Position</td><td>${esc(athlete.position || 'N/A')}</td></tr>
      <tr><td>Jersey #</td><td>${esc(athlete.jersey || 'N/A')}</td></tr>
      <tr><td>City / Province</td><td>${esc(athlete.city || 'N/A')}</td></tr>
      <tr><td>Season</td><td>${esc(athlete.season || 'N/A')}</td></tr>
      <tr><td>Bio</td><td>${esc(athlete.bio || 'N/A')}</td></tr>
    </table>
    <h3>Verified Documents</h3>
    <div class="docs">
      ${athlete.birthCert ? `<a href="${esc(athlete.birthCert)}" target="_blank" class="btn">Birth Certificate</a>` : ''}
      ${athlete.schoolId ? `<a href="${esc(athlete.schoolId)}" target="_blank" class="btn">School ID</a>` : ''}
      ${athlete.medicalCert ? `<a href="${esc(athlete.medicalCert)}" target="_blank" class="btn">Medical Certificate</a>` : ''}
      ${athlete.consentForm ? `<a href="${esc(athlete.consentForm)}" target="_blank" class="btn">Parental Consent</a>` : ''}
      ${athlete.waiverForm ? `<a href="${esc(athlete.waiverForm)}" target="_blank" class="btn">Waiver Form</a>` : ''}
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", loadProfile);
</script>
</body>
</html>
